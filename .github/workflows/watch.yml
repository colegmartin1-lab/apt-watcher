name: watch

on:
  # GitHub's own schedule runs hours late, so cron-job.org calls
  # workflow_dispatch every 5 minutes; this cron is just a backup.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the branch tip, not the commit the run was queued on: a run
      # that waited in the queue would otherwise start from state the previous
      # run already replaced, and its push would be rejected.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Long-term rentals: reads the listing-alert emails in Gmail (StreetEasy,
      # Zillow, Trulia, ...) plus Reddit / Listings Project / Facebook-group
      # posts, filters hard, and pushes only real matches.
      - name: poll long-term rentals (inbox watcher)
        run: python inbox_watcher.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: persist watcher state
        if: always()
        run: |
          git config user.name "apt-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add inbox_state.json
          git diff --cached --quiet && exit 0
          git commit -m "update seen listings"
          # If someone pushed mid-run, replay this run's state on top (ours wins).
          git push || { git pull --rebase -X theirs && git push; }
